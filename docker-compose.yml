services:
  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - dbdata:/db
    restart: unless-stopped

  agent:
    build: .
    command: python agent.py start
    env_file: .env
    volumes:
      - dbdata:/db
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - api

volumes:
  dbdata:
  caddy_data:
  caddy_config:
